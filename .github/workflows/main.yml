name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Icon Files
      run: |
        rm -f app/src/main/res/mipmap-hdpi/ic_launcher.xml
        rm -f app/src/main/res/mipmap-hdpi/ic_launcher_round.xml
        rm -f app/src/main/res/mipmap-xhdpi/ic_launcher.xml
        rm -f app/src/main/res/mipmap-xxhdpi/ic_launcher.xml
        echo "Icons removed"

    - name: Fix Manifest
      run: |
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.NamazTracker"
                android:usesCleartextTraffic="false">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleTask"
                    android:screenOrientation="portrait"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                    <intent-filter>
                        <action android:name="android.intent.action.VIEW"/>
                        <category android:name="android.intent.category.DEFAULT"/>
                        <category android:name="android.intent.category.BROWSABLE"/>
                        <data android:scheme="namaztracker" android:host="login"/>
                    </intent-filter>
                </activity>
                <activity
                    android:name=".SetupActivity"
                    android:exported="false"
                    android:screenOrientation="portrait"
                    android:windowSoftInputMode="adjustResize"/>
            </application>
        </manifest>
        EOF

    - name: Fix build.gradle
      run: |
        cat > app/build.gradle << 'EOF'
        plugins { id 'com.android.application' }
        android {
            namespace 'com.bjnt.namaztracker'
            compileSdk 34
            defaultConfig {
                applicationId "com.bjnt.namaztracker"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                debug { minifyEnabled false }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
        }
        EOF

    - name: Download Gradle Wrapper
      run: |
        curl -sL "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
          -o gradle/wrapper/gradle-wrapper.jar

    - name: Fix Java Code
      run: |
        sed -i 's/cfg.optString("activation_codes".*replace.*replace.*replace.*/cfg.optString("valid_codes", "bjnt2026,namaz786");/g' \
          app/src/main/java/com/bjnt/namaztracker/MainActivity.java
        sed -i 's/cfg.optString("activation_codes".*replace.*replace.*replace.*/cfg.optString("valid_codes", "bjnt2026,namaz786");/g' \
          app/src/main/java/com/bjnt/namaztracker/SetupActivity.java
    
    - name: Google login + no activation screen
      run: |
        cat > /tmp/patch_nt.py << 'PY'
        import sys
        base = "app/src/main/java/com/bjnt/namaztracker/"
        def patch(fname, pairs):
            p = base + fname
            s = open(p, encoding="utf-8").read()
            for old, new in pairs:
                if s.count(old) != 1:
                    sys.exit("PATCH FAILED in " + fname + ": anchor found " + str(s.count(old)) + " times: " + old)
                s = s.replace(old, new)
            open(p, "w", encoding="utf-8").write(s)
        patch("MainActivity.java", [
            ("    private SharedPreferences prefs;",
             "    private SharedPreferences prefs;\n    private String pendingToken = null;"),
            ('prefs = getSharedPreferences("nt2_prefs", MODE_PRIVATE);',
             'prefs = getSharedPreferences("nt2_prefs", MODE_PRIVATE);\n        captureToken(getIntent());'),
            ("    private void fetchConfigThenSetup() {",
             """    private void captureToken(Intent i) {
            try {
                if (i != null && i.getData() != null && "namaztracker".equals(i.getData().getScheme())) {
                    String t = i.getData().getQueryParameter("t");
                    if (t != null && !t.isEmpty()) pendingToken = t;
                }
            } catch (Exception ignored) {}
        }

        private void deliverToken() {
            if (pendingToken == null || webView == null) return;
            String t = pendingToken;
            pendingToken = null;
            webView.evaluateJavascript("if(window.rlGoogleToken){window.rlGoogleToken(" + JSONObject.quote(t) + ");}", null);
        }

        @Override protected void onNewIntent(Intent intent) {
            super.onNewIntent(intent);
            setIntent(intent);
            captureToken(intent);
            deliverToken();
        }

        private void fetchConfigThenSetup() {"""),
            ("s.setCacheMode(WebSettings.LOAD_DEFAULT);",
             's.setCacheMode(WebSettings.LOAD_DEFAULT);\n        s.setUserAgentString(s.getUserAgentString() + " NamazAPK/2");'),
            ("    private String pendingToken = null;",
             "    private String pendingToken = null;\n    private android.webkit.ValueCallback<Uri[]> fileCb;\n    private String pendingSave = null;"),
            ("@Override public void onGeolocationPermissionsShowPrompt(",
             """@Override public boolean onShowFileChooser(WebView w, android.webkit.ValueCallback<Uri[]> cb, FileChooserParams fp) {
                    if (fileCb != null) fileCb.onReceiveValue(null);
                    fileCb = cb;
                    try {
                        Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                        i.addCategory(Intent.CATEGORY_OPENABLE);
                        i.setType("*/*");
                        startActivityForResult(Intent.createChooser(i, "Backup file chunen"), 7701);
                    } catch (Exception e) { fileCb = null; return false; }
                    return true;
                }
                @Override public void onGeolocationPermissionsShowPrompt("""),
            ("@JavascriptInterface public void refreshFromSheet()",
             """@JavascriptInterface public void saveBackup(String name, String text) {
                pendingSave = text;
                runOnUiThread(() -> {
                    Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                    i.addCategory(Intent.CATEGORY_OPENABLE);
                    i.setType("application/json");
                    i.putExtra(Intent.EXTRA_TITLE, name);
                    startActivityForResult(i, 7702);
                });
            }
            @JavascriptInterface public void refreshFromSheet()"""),
            ("@Override public void onBackPressed()",
             """@Override protected void onActivityResult(int rq, int rs, Intent d) {
            if (rq == 7701) {
                if (fileCb != null) {
                    Uri[] r = null;
                    if (rs == RESULT_OK && d != null && d.getData() != null) r = new Uri[]{ d.getData() };
                    fileCb.onReceiveValue(r);
                    fileCb = null;
                }
                return;
            }
            if (rq == 7702) {
                if (rs == RESULT_OK && d != null && d.getData() != null && pendingSave != null) {
                    try {
                        java.io.OutputStream os = getContentResolver().openOutputStream(d.getData());
                        os.write(pendingSave.getBytes("UTF-8"));
                        os.close();
                        android.widget.Toast.makeText(this, "Backup save ho gaya", android.widget.Toast.LENGTH_SHORT).show();
                    } catch (Exception e) {
                        android.widget.Toast.makeText(this, "Save nahi hua", android.widget.Toast.LENGTH_SHORT).show();
                    }
                }
                pendingSave = null;
                return;
            }
            super.onActivityResult(rq, rs, d);
        }

        @Override public void onBackPressed()"""),
            ("swipe.setOnRefreshListener(() -> webView.reload());",
             "swipe.setEnabled(false);"),
            ("injectUserData();",
             "injectUserData();\n                deliverToken();"),
            ("String url = req.getUrl().toString();",
             'String url = req.getUrl().toString();\n                if(url.contains("/login.html")) {\n                    startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));\n                    return true;\n                }'),
        ])
        patch("SetupActivity.java", [
            ('prefs = getSharedPreferences("nt2_prefs", MODE_PRIVATE);',
             """prefs = getSharedPreferences("nt2_prefs", MODE_PRIVATE);
            if (!prefs.getBoolean("setup_done", false)) {
                prefs.edit()
                    .putString("user_id", "u_" + java.util.UUID.randomUUID().toString().substring(0, 8))
                    .putString("user_name", "User")
                    .putBoolean("setup_done", true)
                    .apply();
            }
            startActivity(new Intent(this, MainActivity.class));
            finish();
            if (true) return;"""),
        ])
        print("Patched OK")
        PY
        python3 /tmp/patch_nt.py

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NamazTracker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
