name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle 8.4
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /opt/
        echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH

    - name: Generate Keystore
      run: |
        mkdir -p app
        keytool -genkey -v \
          -keystore app/keystore.jks \
          -alias namazkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass bjnt2026ks -keypass bjnt2026ks \
          -dname "CN=BJNT,O=Karachi,C=PK" \
          -storetype JKS

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NamazTracker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
