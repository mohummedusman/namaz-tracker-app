name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Icon Files
      run: |
        rm -f app/src/main/res/mipmap-hdpi/ic_launcher.xml
        rm -f app/src/main/res/mipmap-hdpi/ic_launcher_round.xml
        rm -f app/src/main/res/mipmap-xhdpi/ic_launcher.xml
        rm -f app/src/main/res/mipmap-xxhdpi/ic_launcher.xml
        echo "Icons removed"

    - name: Fix Manifest
      run: |
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.NamazTracker"
                android:usesCleartextTraffic="false">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:screenOrientation="portrait"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
                <activity
                    android:name=".SetupActivity"
                    android:exported="false"
                    android:screenOrientation="portrait"
                    android:windowSoftInputMode="adjustResize"/>
            </application>
        </manifest>
        EOF

    - name: Fix build.gradle
      run: |
        cat > app/build.gradle << 'EOF'
        plugins { id 'com.android.application' }
        android {
            namespace 'com.bjnt.namaztracker'
            compileSdk 34
            defaultConfig {
                applicationId "com.bjnt.namaztracker"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                debug { minifyEnabled false }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
        }
        EOF

    - name: Download Gradle Wrapper
      run: |
        curl -sL "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
          -o gradle/wrapper/gradle-wrapper.jar

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NamazTracker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
