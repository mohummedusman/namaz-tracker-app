name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create keystore directory
      run: mkdir -p app

    - name: Generate Keystore
      run: |
        keytool -genkey -v \
          -keystore app/keystore.jks \
          -alias namazkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass bjnt2026ks \
          -keypass bjnt2026ks \
          -dname "CN=BJNT, O=Karachi, C=PK" \
          -storetype JKS

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NamazTracker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
