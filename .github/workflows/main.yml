name: 🕌 Build Namaz Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Keystore
      run: |
        keytool -genkeypair -v \
          -keystore app/keystore.jks -alias namazkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass bjnt2026ks -keypass bjnt2026key \
          -dname "CN=NamazTracker,OU=BJNT,O=Karachi,L=Karachi,ST=Sindh,C=PK"

    - name: Build APK
      run: chmod +x gradlew && ./gradlew assembleRelease
      env:
        KS_PASS: bjnt2026ks
        KEY_PASS: bjnt2026key

    - name: Rename APK
      run: mv app/build/outputs/apk/release/app-release.apk NamazTracker.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NamazTracker-APK
        path: NamazTracker.apk
        retention-days: 90
